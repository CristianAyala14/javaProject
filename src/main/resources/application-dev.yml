server:
  port: 8081

spring:
  application:
    name: gestiondepedidos-dev

  datasource:
    url: jdbc:h2:mem:gestiondepedidos
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    '[primerspringboot.com.gestiondepedidos]': DEBUG
    '[org.springframework.web]': WARN